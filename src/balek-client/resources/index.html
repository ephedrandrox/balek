<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description"
		  content="Scaptura - a web application with iOS Controller">
	<link rel="manifest" href="/manifest.json" >
    <title>Scaptura</title>

	<link rel="apple-touch-icon" sizes="180x180" href="/png/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/png/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/png/favicon-16x16.png">
	<link rel="mask-icon" href="/png/safari-pinned-tab.svg" color="#5bbad5">
	<meta name="msapplication-TileColor" content="#da532c">
	<meta name="theme-color" content="#ffffff">
</head>
<body  bgcolor=black>
	<script>
	    dojoConfig = {
	        has: {
	            "dojo-firebug": true,
	            "dojo-debug-messages": true
	        },
	        // Don't attempt to parse the page for widgets
	        parseOnLoad: false,
	        packages: [
	            {
	                name: "balek-client",
	                location: "../balek-client"
	            }
	        ],
	        // Timeout after 10 seconds
	        waitSeconds: 10,
	        // Get "fresh" resources
	        cacheBust: false,
	        async: true
	    };
	</script>
	 
	
	 
	<script src="dojo/dojo.js"></script>

	<script> 
	  
	    var BalekApp = {};
	   
	    require([ "balek-client/Interface", "dojo/domReady!" ], function (Interface) {
			BalekApp._Interface = new Interface();
		});
	</script>


</body>
</html>
